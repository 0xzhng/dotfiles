set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ',*:clipboard'
set -g base-index 1
set -g pane-base-index 1
set-option -g prefix C-b
bind C-b send-prefix
bind i copy-mode -u
set -g mouse off
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g allow-passthrough on
set-environment -gu TERMINFO
set -g renumber-windows on
setw -g mode-keys vi
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

unbind x
bind x kill-pane
unbind '"'
unbind %
bind-key -n C-t split-window -h -c "#{pane_current_path}"
bind-key -n C-y split-window -v -c "#{pane_current_path}"
bind-key -n C-n new-window -a -c "#{pane_current_path}"
bind c new-window -a -c "#{pane_current_path}"
unbind .
bind . command-prompt -T window-target -p index { move-window -t ":%%" }
bind-key -n C-x kill-pane
bind-key -n C-k send-keys C-c
# Ghostty maps logical Super (physical Alt) + R/U to these Meta sequences.
bind-key -n M-r previous-window
bind-key -n M-u next-window
bind-key -n C-j select-pane -D
bind-key -n C-h select-pane -L
bind-key -n C-l select-pane -R
bind k resize-pane -U 2
bind j resize-pane -D 2
bind h resize-pane -L 2
bind l resize-pane -R 2

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g detach-on-destroy on


set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_up ''
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @yank_selection_mouse 'clipboard'

set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-continuum auto-saves/auto-restores entire tmux server state.
# Disabled so save/restore only happens explicitly via tmux-resurrect keybindings.
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-restore-bash-history 'on'
set -g @resurrect-strategy-vim  'session'
set -g @resurrect-strategy-nvim 'session'

# Plugins: Info Widgets
set -g @plugin 'tmux-plugins/tmux-cpu'
# Custom network speed script (auto-detects interface)

# Plugins: Quality of Life
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'Morantron/tmux-fingers'

# Plugins: Theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

set -g status-right ''
